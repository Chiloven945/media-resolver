name: Protocol Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2,5'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run optional live smoke check
        env:
          SMOKE_LINK: ${{ vars.SMOKE_LINK }}
        run: |
          if [ -z "$SMOKE_LINK" ]; then
            echo "SMOKE_LINK is not configured; skipping live protocol check."
            exit 0
          fi
          cargo run --release -p media-resolver-cli -- --json "$SMOKE_LINK"
