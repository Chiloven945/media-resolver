name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: WASM parity test
        working-directory: crates/wasm
        run: wasm-pack test --node

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build WASM
        working-directory: web
        run: bun run wasm:build
      - name: Type check
        working-directory: web
        run: bun run typecheck
      - name: Unit tests
        working-directory: web
        run: bun run test
      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium webkit
      - name: End-to-end tests
        working-directory: web
        run: bun run test:e2e
      - name: Static generation
        working-directory: web
        run: bun run generate
      - name: Build Worker WASM
        working-directory: crates/wasm
        run: wasm-pack build --target bundler --release --out-dir ../../worker/pkg --out-name engine
      - name: Patch Worker WASM glue
        run: node scripts/patch-worker-wasm.mjs worker/pkg/engine.js
      - name: Type check Worker
        run: web/node_modules/.bin/tsc -p worker/tsconfig.json
      - name: Check Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dist
