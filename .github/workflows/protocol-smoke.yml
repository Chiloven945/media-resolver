name: Protocol Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2,5'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        route:
          - public-v2
          - embed-v1
          - managed-v1
    steps:
      - name: Select optional smoke URL
        id: route
        env:
          ROUTE: ${{ matrix.route }}
          PUBLIC_URL: ${{ vars.SMOKE_PUBLIC_URL }}
          EMBED_URL: ${{ vars.SMOKE_EMBED_URL }}
          MANAGED_URL: ${{ vars.SMOKE_MANAGED_URL }}
        run: |
          case "$ROUTE" in
            public-v2)  url="$PUBLIC_URL" ;;
            embed-v1)   url="$EMBED_URL" ;;
            managed-v1) url="$MANAGED_URL" ;;
            *) exit 2 ;;
          esac
          if [ -z "$url" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No live URL configured for $ROUTE; skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Check live route
        if: steps.route.outputs.configured == 'true'
        env:
          URL: ${{ steps.route.outputs.url }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 25 \
            --output /tmp/response.bin \
            "$URL"
          test -s /tmp/response.bin
          echo "Live route returned a non-empty successful response."
